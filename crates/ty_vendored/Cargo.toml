[package]
name = "sightline-ty-vendored"
version = "0.1.0"
description = "sightline's fork of ty_vendored, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = "https://github.com/Skyway1111/ty-unnecessary"
repository = "https://github.com/Skyway1111/ty-unnecessary"
license = { workspace = true }
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[dependencies]
ruff_db = { workspace = true }
static_assertions = { workspace = true }
zip = { workspace = true }

[build-dependencies]
path-slash = { workspace = true }
walkdir = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
walkdir = { workspace = true }

[features]
zstd = ["zip/zstd"]
deflate = ["zip/deflate-flate2-zlib-rs"]

[lints]
workspace = true

[lib]
name = "ty_vendored"
doctest = false
