[package]
name = "sightline-ty-module-resolver"
version = "0.1.0"
description = "sightline's fork of ty_module_resolver, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = "https://github.com/Skyway1111/ty-unnecessary"
repository = "https://github.com/Skyway1111/ty-unnecessary"
license = { workspace = true }
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[lib]
name = "ty_module_resolver"

[dependencies]
ruff_db = { workspace = true }
ruff_memory_usage = { workspace = true }
ruff_python_ast = { workspace = true, features = ["salsa"] }
ruff_python_stdlib = { workspace = true }

anyhow = { workspace = true }
camino = { workspace = true }
compact_str = { workspace = true }
get-size2 = { workspace = true }
ordermap = { workspace = true }
regex = { workspace = true }
regex-syntax = { workspace = true }
rustc-hash = { workspace = true }
salsa = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ruff_db = { workspace = true, features = ["testing", "os"] }
# Keep this path-only so Cargo strips the unpublished ty dev-dependency when packaging.
ty_vendored = { package = "sightline-ty-vendored", version = "0.1.0", path = "../ty_vendored" }

insta = { workspace = true, features = ["filters"] }
tempfile = { workspace = true }

[lints]
workspace = true
