[package]
name = "sightline-ruff-text-size"
version = "0.1.0"
description = "sightline's fork of ruff_text_size, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = "https://github.com/Skyway1111/ty-unnecessary"
repository = "https://github.com/Skyway1111/ty-unnecessary"
license = { workspace = true }
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[dependencies]
get-size2 = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_test = { workspace = true }
static_assertions = { workspace = true }

[features]
serde = ["dep:serde"]
get-size = ["dep:get-size2"]

[lints]
workspace = true

[[test]]
name = "serde"
path = "tests/serde.rs"
required-features = ["serde"]

[lib]
name = "ruff_text_size"
test = false
