[package]
name = "sightline-ruff-macros"
version = "0.1.0"
description = "sightline's fork of ruff_macros, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = "https://github.com/Skyway1111/ty-unnecessary"
repository = "https://github.com/Skyway1111/ty-unnecessary"
license = { workspace = true }
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[lib]
name = "ruff_macros"
proc-macro = true
doctest = false
test = false

[dependencies]
ruff_python_trivia = { workspace = true }

heck = { workspace = true }
itertools = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
regex = { workspace = true }
syn = { workspace = true, features = ["derive", "parsing", "extra-traits", "full"] }

[lints]
workspace = true
