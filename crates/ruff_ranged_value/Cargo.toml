[package]
name = "sightline-ruff-ranged-value"
version = "0.1.0"
description = "sightline's fork of ruff_ranged_value, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = "https://github.com/Skyway1111/ty-unnecessary"
repository = "https://github.com/Skyway1111/ty-unnecessary"
license = { workspace = true }
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[lib]
name = "ruff_ranged_value"
test = false
doctest = false

[dependencies]
ruff_db = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_text_size = { workspace = true }

get-size2 = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

[features]
get-size = ["dep:get-size2"]
schemars = ["dep:schemars"]
