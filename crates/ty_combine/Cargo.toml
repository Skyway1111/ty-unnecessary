[package]
name = "sightline-ty-combine"
version = "0.1.0"
description = "sightline's fork of ty_combine, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[lib]
name = "ty_combine"
doctest = false

[dependencies]
ruff_db = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_ranged_value = { workspace = true }

ordermap = { workspace = true }

[lints]
workspace = true
