[package]
name = "sightline-ruff-python-parser"
version = "0.1.0"
description = "sightline's fork of ruff_python_parser, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
authors = ["Charlie Marsh <charlie.r.marsh@gmail.com>", "RustPython Team"]
edition = { workspace = true }
rust-version = { workspace = true }
homepage = "https://github.com/Skyway1111/ty-unnecessary"
repository = "https://github.com/Skyway1111/ty-unnecessary"
license = { workspace = true }
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[lib]
name = "ruff_python_parser"

[dependencies]
ruff_python_ast = { workspace = true, features = ["get-size"] }
ruff_python_trivia = { workspace = true }
ruff_text_size = { workspace = true, features = ["get-size"] }

bitflags = { workspace = true }
bstr = { workspace = true }
drop_bomb = { workspace = true }
get-size2 = { workspace = true }
memchr = { workspace = true }
rustc-hash = { workspace = true }
static_assertions = { workspace = true }
stacker = { workspace = true }
thin-vec = { workspace = true }
unicode-ident = { workspace = true }
unicode-normalization = { workspace = true }
unicode_names2 = { workspace = true }

[dev-dependencies]
annotate_snippets = { workspace = true }
ruff_python_ast = { workspace = true, features = ["serde"] }
ruff_source_file = { workspace = true }

anyhow = { workspace = true }
datatest-stable = { workspace = true }
insta = { workspace = true }
itertools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = { workspace = true }

[[test]]
name = "fixtures"
harness = false

[lints]
workspace = true
