[package]
name = "sightline-ruff-source-file"
version = "0.1.0"
description = "sightline's fork of ruff_source_file, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = "https://github.com/Skyway1111/ty-unnecessary"
repository = "https://github.com/Skyway1111/ty-unnecessary"
license = { workspace = true }
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[lib]
name = "ruff_source_file"

[dependencies]
ruff_text_size = { workspace = true }

get-size2 = { workspace = true, optional = true }
memchr = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]

[features]
get-size = ["dep:get-size2", "ruff_text_size/get-size"]
serde = ["dep:serde", "ruff_text_size/serde"]

[lints]
workspace = true
