[package]
name = "sightline-ty-python-core"
version = "0.1.0"
description = "sightline's fork of ty_python_core, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = "https://github.com/Skyway1111/ty-unnecessary"
repository = "https://github.com/Skyway1111/ty-unnecessary"
license = { workspace = true }
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[dependencies]
ruff_db = { workspace = true }
ruff_index = { workspace = true, features = ["salsa"] }
ruff_memory_usage = { workspace = true }
ruff_python_ast = { workspace = true, features = ["salsa"] }
ruff_python_parser = { workspace = true }
ruff_text_size = { workspace = true }
ty_module_resolver = { workspace = true }
ty_vendored = { workspace = true }
ty_site_packages = { workspace = true }
ty_combine = { workspace = true }

bitflags = { workspace = true }
bitvec = { workspace = true }
char_str = { workspace = true, features = ["get-size"] }
get-size2 = { workspace = true, features = ["indexmap", "ordermap", "thin-vec"] }
hashbrown = { workspace = true }
itertools = { workspace = true }
ruff_macros = { workspace = true, optional = true }
rustc-hash = { workspace = true }
salsa = { workspace = true, features = ["compact_str", "ordermap"] }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = {workspace = true, optional = true }
smallvec = { workspace = true }
static_assertions = { workspace = true }
thin-vec = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ruff_db = { workspace = true, features = ["testing", "os"] }
ruff_python_trivia = { workspace = true }

anyhow = { workspace = true }

[features]
serde = ["dep:serde", "dep:ruff_macros"]
schemars = ["dep:schemars", "dep:serde_json"]
testing = []

[lints]
workspace = true

[lib]
name = "ty_python_core"
doctest = false
