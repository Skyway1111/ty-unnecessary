[package]
name = "sightline-ruff-python-literal"
version = "0.1.0"
description = "sightline's fork of ruff_python_literal, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
authors = ["Charlie Marsh <charlie.r.marsh@gmail.com>", "RustPython Team"]
edition = { workspace = true }
rust-version = { workspace = true }
homepage = "https://github.com/Skyway1111/ty-unnecessary"
repository = "https://github.com/Skyway1111/ty-unnecessary"
license = { workspace = true }
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[lib]
name = "ruff_python_literal"
doctest = false

[dependencies]
ruff_python_ast = { workspace = true }

bitflags = { workspace = true }
icu_properties = { workspace = true }
itertools = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
