[package]
name = "sightline-ty-site-packages"
version = "0.1.0"
description = "sightline's fork of ty_site_packages, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = "https://github.com/Skyway1111/ty-unnecessary"
repository = "https://github.com/Skyway1111/ty-unnecessary"
license = { workspace = true }
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[lib]
name = "ty_site_packages"
doctest = false

[dependencies]
annotate_snippets = { workspace = true }
ruff_db = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_python_trivia = { workspace = true }
ruff_source_file = { workspace = true }
ruff_text_size = { workspace = true }
ty_static = { workspace = true }

camino = { workspace = true }
colored = { workspace = true }
get-size2 = { workspace = true }
indexmap = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ruff_db = { workspace = true, features = ["testing", "os"] }
tempfile = { workspace = true }

[lints]
workspace = true
