[package]
name = "sightline-ruff-diagnostics"
version = "0.1.0"
description = "sightline's fork of ruff_diagnostics, an internal crate of ruff and ty (astral-sh/ruff), as the sightline binary pins it"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = "https://github.com/Skyway1111/ty-unnecessary"
repository = "https://github.com/Skyway1111/ty-unnecessary"
license = { workspace = true }
exclude = ["tests/**", "resources/**", "benches/**", "fuzz/**", "**/snapshots/**"]

[lib]
name = "ruff_diagnostics"
doctest = false
test = false

[dependencies]
ruff_text_size = { workspace = true, features = ["get-size"] }

get-size2 = { workspace = true }
is-macro = { workspace = true }
serde = { workspace = true, optional = true, features = [] }

[features]
serde = ["dep:serde", "ruff_text_size/serde"]
